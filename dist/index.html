<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TokenHUD</title>
<style>
  :root {
    --bg: rgba(17, 19, 24, 0.86);
    --bg-solid: #14161c;
    --stroke: rgba(255, 255, 255, 0.09);
    --stroke-strong: rgba(255, 255, 255, 0.16);
    --text: #eceef1;
    --text-dim: #b6bcc6;
    --muted: #7f8794;
    --ok: #34d399;
    --warn: #fbbf24;
    --hot: #f87171;
    --info: #60a5fa;
    --track: rgba(255, 255, 255, 0.09);
    --shadow: 0 8px 22px -10px rgba(0, 0, 0, 0.5), 0 1px 4px -1px rgba(0, 0, 0, 0.35);
    --num: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  body {
    font: 12px/1.35 -apple-system, "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none;
  }
  body.card { padding: 7px; }
  body.circle { padding: 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ============ card mode ============ */
  .card {
    background: var(--bg);
    border: 1px solid var(--stroke);
    border-radius: 14px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    padding: 10px 12px 9px;
    display: flex; flex-direction: column; gap: 9px;
  }
  body.circle .card { display: none; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    height: 16px;
  }
  .brand { display: flex; align-items: center; gap: 6px; }
  .brand .mark {
    width: 13px; height: 13px; border-radius: 4px; flex: none;
    background: linear-gradient(150deg, var(--ok), #0f1116);
  }
  .brand b {
    font-size: 10px; font-weight: 700; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--text-dim);
  }
  .ctl { display: flex; gap: 1px; opacity: 0; transition: opacity 0.15s; }
  header:hover .ctl, .card:hover .ctl { opacity: 1; }
  .ctl button {
    all: unset; cursor: pointer; color: var(--muted); line-height: 1;
    width: 17px; height: 17px; display: grid; place-items: center;
    border-radius: 5px; font-size: 11px;
  }
  .ctl button:hover { color: var(--text); background: var(--track); }

  .tool { display: flex; flex-direction: column; gap: 5px; }
  .tool .name {
    display: flex; align-items: baseline; justify-content: space-between;
    font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
  }
  .tool .name .cost { color: var(--text-dim); font-family: var(--num); letter-spacing: 0; }

  .row { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 8px; }
  .row > * { min-width: 0; }
  .row .k { font-size: 9px; color: var(--muted); text-transform: uppercase; }
  .bar {
    height: 6px; border-radius: 999px; background: var(--track);
    overflow: hidden; position: relative;
  }
  .bar > span {
    position: absolute; inset: 0 auto 0 0; border-radius: inherit;
    width: 0; transition: width 0.5s cubic-bezier(.2,.7,.2,1), background 0.4s;
  }
  .bar > span.ok   { background: linear-gradient(90deg, #2fbf8f, var(--ok)); }
  .bar > span.warn { background: linear-gradient(90deg, #e0a017, var(--warn)); }
  .bar > span.hot  { background: linear-gradient(90deg, #e05656, var(--hot)); }
  .row .v {
    font-family: var(--num); font-size: 10px; color: var(--text);
    text-align: right; white-space: nowrap;
  }
  .row.raw .v { color: var(--muted); }
  .row.auth .v { color: var(--text); }
  .row.note {
    grid-template-columns: 1fr; margin-top: 1px;
  }
  .row.note .v {
    font-size: 9.5px; color: var(--muted); text-align: left;
    white-space: normal; line-height: 1.4;
  }
  .row.stale { opacity: 0.5; }

  .adv { display: flex; gap: 6px; align-items: baseline; font-size: 10px; color: var(--text-dim); }
  .adv .dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); transform: translateY(-1px); }
  .adv.warn .dot { background: var(--warn); }
  .adv.critical .dot { background: var(--hot); }
  .adv.critical { color: var(--text); }

  .sep { height: 1px; background: var(--stroke); margin: 1px -2px; }
  footer {
    display: flex; justify-content: flex-end;
    font-size: 9px; color: var(--muted); font-family: var(--num);
  }
  .empty { color: var(--muted); font-size: 11px; text-align: center; padding: 6px 0; }

  /* ============ circle mode ============ */
  #rings { display: none; flex-direction: column; align-items: center; gap: 9px; padding: 9px 0; }
  body.circle #rings { display: flex; }
  .ring {
    position: relative; width: 60px; height: 60px; border-radius: 50%;
    background:
      radial-gradient(circle at 38% 28%, rgba(255,255,255,0.08), rgba(255,255,255,0) 60%),
      var(--bg);
    border: 1px solid var(--stroke-strong);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.06);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
  }
  .ring.stale { opacity: 0.5; }
  .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring .track { stroke: var(--track); }
  .ring .fill {
    transition: stroke-dashoffset 0.6s cubic-bezier(.2,.7,.2,1), stroke 0.4s;
    stroke-linecap: round;
  }
  .ring .fill.ok { stroke: var(--ok); }
  .ring .fill.warn { stroke: var(--warn); }
  .ring .fill.hot { stroke: var(--hot); }
  .ring .fill.info { stroke: var(--info); }
  .ring .lbl {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1px;
  }
  .ring .lbl b { font-family: var(--num); font-size: 13px; font-weight: 700; color: var(--text); }
  .ring .lbl i {
    font-style: normal; font-size: 7.5px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted);
  }
</style>
</head>
<body class="circle">
  <div class="card" id="card" data-tauri-drag-region>
    <header data-tauri-drag-region>
      <span class="brand"><span class="mark"></span><b>TokenHUD</b></span>
      <span class="ctl">
        <button id="side" title="Circle: move to other edge">&#8646;</button>
        <button id="mode" title="Card / circle mode">&#9673;</button>
        <button id="settings" title="Settings">&#9881;</button>
        <button id="close" title="Hide">&times;</button>
      </span>
    </header>
    <div id="body"></div>
    <footer id="foot"></footer>
  </div>

  <div id="rings" data-tauri-drag-region></div>

<script type="module">
  import { renderCard, renderCircle } from "./hud.mjs";

  const $ = (id) => document.getElementById(id);

  let mode = "circle";
  let side = "right";
  let lastSnaps = [];

  async function fitCard() {
    try {
      const T = window.__TAURI__;
      const h = Math.ceil($("card").getBoundingClientRect().height) + 14;
      await T.window.getCurrentWindow().setSize(new T.window.LogicalSize(268, h));
    } catch (_) {}
  }

  function render(snaps) {
    if (snaps) lastSnaps = (snaps || []).filter(Boolean);
    if (mode === "circle") {
      renderCircle($("rings"), lastSnaps);
      return;
    }
    $("foot").textContent = renderCard($("body"), lastSnaps);
    fitCard();
  }

  function setMode(m) {
    mode = m === "circle" ? "circle" : "card";
    document.body.className = mode;
    render(null);
  }

  // Keep the reset countdown ticking between backend refreshes.
  setInterval(() => render(null), 15000);

  const T = window.__TAURI__;
  if (T) {
    T.event.listen("usage", (e) => render(e.payload));
    T.event.listen("mode", (e) => setMode(e.payload));
    T.core.invoke("get_config").then((c) => {
      side = c?.ui?.circle_side || "right";
      setMode(c?.ui?.mode || "circle");
    }).catch(() => {});
    T.core.invoke("get_snapshots").then(render).catch(() => {});
    $("close").onclick = () => T.window.getCurrentWindow().hide().catch(() => {});
    $("settings").onclick = () => T.core.invoke("open_settings").catch(() => {});
    $("mode").onclick = () =>
      T.core.invoke("set_mode", { mode: mode === "card" ? "circle" : "card" }).catch(() => {});
    $("side").onclick = () => {
      side = side === "left" ? "right" : "left";
      T.core.invoke("set_circle_side", { side }).catch(() => {});
    };
    window.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      T.core.invoke("show_context_menu").catch(() => {});
    });
  }

  // Expose for the headless render test.
  window.__hudRender = render;
</script>
</body>
</html>
