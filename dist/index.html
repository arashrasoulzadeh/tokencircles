<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TokenHUD</title>
<style>
  :root {
    --bg: rgba(20, 22, 28, 0.82);
    --stroke: rgba(255, 255, 255, 0.08);
    --text: #e8eaed;
    --muted: #9aa0a6;
    --ok: #34d399;
    --warn: #fbbf24;
    --hot: #f87171;
    --track: rgba(255, 255, 255, 0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  body {
    font: 12px/1.3 -apple-system, "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    padding: 6px;
  }
  .card {
    background: var(--bg);
    border: 1px solid var(--stroke);
    border-radius: 12px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    padding: 9px 11px 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    letter-spacing: 0.05em; text-transform: uppercase;
    font-size: 10px; color: var(--muted);
  }
  header b { color: var(--text); font-weight: 700; }
  header button {
    all: unset; cursor: pointer; color: var(--muted);
    padding: 0 3px; border-radius: 4px; line-height: 1;
  }
  header button:hover { color: var(--text); background: var(--track); }

  .tool { display: flex; flex-direction: column; gap: 4px; }
  .tool .name {
    font-size: 10px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.05em; display: flex; justify-content: space-between;
  }
  .tool .name .badge { color: var(--muted); font-variant-numeric: tabular-nums; }

  .row { display: flex; align-items: center; gap: 7px; }
  .row .k { width: 34px; font-size: 9px; color: var(--muted); flex: none; }
  .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .bar > span {
    display: block; height: 100%; width: 0; background: var(--ok);
    transition: width 0.4s ease, background 0.4s ease;
  }
  .row .v {
    width: 78px; text-align: right; flex: none;
    font-size: 10px; color: var(--text); font-variant-numeric: tabular-nums;
  }
  .auth .v { color: var(--warn); }
  .sep { height: 1px; background: var(--stroke); margin: 1px 0; }
  footer { font-size: 9px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="card" id="card" data-tauri-drag-region>
    <header data-tauri-drag-region>
      <span>Token<b>HUD</b></span>
      <button id="close" title="Hide">&times;</button>
    </header>
    <div id="body"></div>
    <footer id="foot">waiting for data&hellip;</footer>
  </div>

<script>
  // Placeholder caps (weighted tokens) until the user enters real plan limits.
  const CAPS = { hour: 3_000_000, five_h: 12_000_000, week: 60_000_000 };
  const NICE = { claude: "Claude Code", codex: "Codex", gemini: "Gemini" };

  const fmt = (n) => {
    if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
    if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(0) + "k";
    return String(n);
  };
  const color = (r) => (r < 0.6 ? "var(--ok)" : r < 0.85 ? "var(--warn)" : "var(--hot)");
  const el = (tag, cls, txt) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  };

  function bar(ratio) {
    const b = el("div", "bar");
    const s = el("span");
    s.style.width = (Math.min(ratio, 1) * 100).toFixed(1) + "%";
    s.style.background = color(ratio);
    b.appendChild(s);
    return b;
  }

  function estRow(label, used, cap) {
    const r = el("div", "row");
    r.append(el("div", "k", label), bar(cap ? used / cap : 0),
             el("div", "v", fmt(used) + " / " + fmt(cap)));
    return r;
  }

  function authRow(rl) {
    const r = el("div", "row auth");
    const pct = rl.used_percent / 100;
    r.append(el("div", "k", rl.window_label), bar(pct),
             el("div", "v", rl.used_percent.toFixed(0) + "%"));
    return r;
  }

  function toolBlock(s) {
    const wrap = el("div", "tool");
    const name = el("div", "name");
    name.append(el("span", null, NICE[s.tool] || s.tool));
    const rl = s.rate_limits || [];
    if (rl.length) name.append(el("span", "badge", "reported"));
    wrap.appendChild(name);

    if (rl.length) {
      rl.forEach((x) => wrap.appendChild(authRow(x)));
    } else {
      wrap.append(
        estRow("hour", s.hour.weighted, CAPS.hour),
        estRow("5h", s.five_h.weighted, CAPS.five_h),
        estRow("week", s.week.weighted, CAPS.week),
      );
    }
    return wrap;
  }

  async function fit() {
    try {
      const T = window.__TAURI__;
      if (!T?.window) return;
      const h = Math.ceil(document.getElementById("card").getBoundingClientRect().height) + 12;
      const w = T.window.getCurrentWindow();
      const { LogicalSize } = T.window;
      await w.setSize(new LogicalSize(268, h));
    } catch (_) {}
  }

  function render(snaps) {
    const body = document.getElementById("body");
    body.innerHTML = "";
    const list = (snaps || []).filter(Boolean);
    if (!list.length) return;
    list.forEach((s, i) => {
      if (i) body.appendChild(el("div", "sep"));
      body.appendChild(toolBlock(s));
    });
    document.getElementById("foot").textContent = "updated " + new Date().toLocaleTimeString();
    fit();
  }

  const T = window.__TAURI__;
  if (T) {
    T.event.listen("usage", (e) => render(e.payload));
    T.core.invoke("get_snapshots").then(render).catch(() => {});
    document.getElementById("close").addEventListener("click", () => {
      T.window.getCurrentWindow().close().catch(() => {});
    });
  }
</script>
</body>
</html>
