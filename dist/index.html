<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TokenHUD</title>
<style>
  :root {
    --bg: rgba(20, 22, 28, 0.82);
    --stroke: rgba(255, 255, 255, 0.08);
    --text: #e8eaed;
    --muted: #9aa0a6;
    --ok: #34d399;
    --warn: #fbbf24;
    --hot: #f87171;
    --track: rgba(255, 255, 255, 0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  body {
    font: 12px/1.3 -apple-system, "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    padding: 6px;
  }
  .card {
    background: var(--bg);
    border: 1px solid var(--stroke);
    border-radius: 12px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    padding: 10px 12px;
    height: calc(100vh - 12px);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-size: 10px;
    color: var(--muted);
  }
  header .tool { color: var(--text); font-weight: 600; }
  header button {
    all: unset;
    cursor: pointer;
    color: var(--muted);
    padding: 0 3px;
    border-radius: 4px;
  }
  header button:hover { color: var(--text); background: var(--track); }
  .row { display: flex; flex-direction: column; gap: 3px; }
  .row .label {
    display: flex; justify-content: space-between;
    font-size: 10px; color: var(--muted);
  }
  .row .label b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .bar > span {
    display: block; height: 100%; width: 0;
    background: var(--ok);
    transition: width 0.4s ease, background 0.4s ease;
  }
  footer { font-size: 9px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .drag { -webkit-app-region: drag; }
</style>
</head>
<body>
  <div class="card" data-tauri-drag-region>
    <header data-tauri-drag-region>
      <span>Token<span class="tool" id="tool">HUD</span></span>
      <button id="close" title="Hide">✕</button>
    </header>

    <div class="row">
      <div class="label"><span>this hour</span><b id="hour-v">—</b></div>
      <div class="bar"><span id="hour-b"></span></div>
    </div>
    <div class="row">
      <div class="label"><span>trailing 5h</span><b id="fiveh-v">—</b></div>
      <div class="bar"><span id="fiveh-b"></span></div>
    </div>
    <div class="row">
      <div class="label"><span>this week</span><b id="week-v">—</b></div>
      <div class="bar"><span id="week-b"></span></div>
    </div>

    <footer id="foot">waiting for data…</footer>
  </div>

<script>
  // Caps are placeholders until the user enters real plan limits.
  // Values are "weighted" tokens (cache reads discounted 10x).
  const CAPS = { hour: 3_000_000, five_h: 12_000_000, week: 60_000_000 };

  const fmt = (n) => {
    if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
    if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(0) + "k";
    return String(n);
  };
  const colorFor = (r) =>
    r < 0.6 ? "var(--ok)" : r < 0.85 ? "var(--warn)" : "var(--hot)";

  function setBar(prefix, used, cap) {
    const r = cap > 0 ? Math.min(used / cap, 1) : 0;
    const bar = document.getElementById(prefix + "-b");
    bar.style.width = (r * 100).toFixed(1) + "%";
    bar.style.background = colorFor(r);
    document.getElementById(prefix + "-v").textContent =
      fmt(used) + " / " + fmt(cap);
  }

  function render(snaps) {
    if (!snaps || !snaps.length) return;
    const s = snaps[0]; // combined multi-tool view comes later
    document.getElementById("tool").textContent =
      s.tool === "claude" ? "HUD · Claude" : "HUD · " + s.tool;
    setBar("hour", s.hour.weighted, CAPS.hour);
    setBar("fiveh", s.five_h.weighted, CAPS.five_h);
    setBar("week", s.week.weighted, CAPS.week);
    document.getElementById("foot").textContent =
      "updated " + new Date().toLocaleTimeString();
  }

  const T = window.__TAURI__;
  if (T) {
    T.event.listen("usage", (e) => render(e.payload));
    T.core.invoke("get_snapshots").then(render).catch(() => {});
    document.getElementById("close").addEventListener("click", () => {
      T.core.invoke("plugin:window|close").catch(() => window.close());
    });
  }
</script>
</body>
</html>
